<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#090a0d;
  --panel:#111216;
  --panel2:#15161a;
  --line:rgba(255,255,255,.12);
  --muted:#858894;
  --text:#f2f2f4;
  --soft:#1b1c21;
}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 20% 0%,rgba(90,95,120,.13),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(100,80,130,.08),transparent 30%),
    #090a0d;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;
  background-image:radial-gradient(rgba(255,255,255,.35) .5px,transparent .5px);
  background-size:4px 4px;
}

button,input{font:inherit}
button{color:inherit}

.page{
  width:min(100%,1220px);
  margin:8px auto 40px;
  padding:0 8px;
  position:relative;
}

.top{
  border:1px solid rgba(255,255,255,.28);
  border-radius:9px;
  background:rgba(16,17,21,.78);
  padding:20px 20px 12px;
  box-shadow:0 12px 40px rgba(0,0,0,.22);
}

.title-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.gamepad{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  color:#e5e5e8;
}

.gamepad svg{
  width:24px;
  height:24px;
}

h1{
  font-size:21px;
  margin:0;
  font-weight:700;
  letter-spacing:-.3px;
}

.subtitle{
  font-size:11px;
  color:#777a85;
  margin:2px 0 0 38px;
}

.search{
  margin-top:11px;
  position:relative;
}

.search svg{
  position:absolute;
  left:11px;
  top:10px;
  width:15px;
  height:15px;
  color:#858894;
}

#search{
  width:100%;
  height:35px;
  border:1px solid rgba(255,255,255,.05);
  border-radius:9px;
  background:#1b1c21;
  color:white;
  outline:none;
  padding:0 12px 0 34px;
  font-size:11px;
}

#search::placeholder{
  color:#7d808b;
}

.filters{
  display:flex;
  gap:8px;
  align-items:center;
  overflow-x:auto;
  padding:9px 0 0;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.07);
  background:#111216;
  border-radius:999px;
  padding:5px 10px;
  font-size:10px;
  color:#92949d;
  cursor:pointer;
  transition:.16s;
}

.filter:hover{
  background:#1a1b20;
  color:#ddd;
}

.filter.active{
  background:#e8e8ea;
  color:#1a1a1c;
  border-color:#fff;
  font-weight:650;
}

.count{
  opacity:.72;
  margin-left:3px;
}

.results{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  color:#737681;
  font-size:10px;
  margin:19px 0 9px 2px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(142px,1fr));
  gap:7px;
}

.card{
  min-width:0;
  border:1px solid rgba(255,255,255,.09);
  border-radius:7px;
  overflow:hidden;
  background:#111216;
  box-shadow:0 5px 18px rgba(0,0,0,.18);
  transition:transform .14s,border-color .14s,box-shadow .14s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:rgba(255,255,255,.22);
  box-shadow:0 9px 25px rgba(0,0,0,.3);
}

.cover{
  height:82px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  cursor:pointer;
}

.cover:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.22;
  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:15px 15px;
}

.cover:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    135deg,
    transparent 45%,
    rgba(0,0,0,.25)
  );
}

.initials{
  position:relative;
  z-index:1;
  font-size:23px;
  font-weight:800;
  letter-spacing:-1px;
  text-shadow:0 2px 4px rgba(0,0,0,.3);
}

.card-body{
  height:53px;
  padding:8px 7px 6px;
  position:relative;
}

.name{
  font-size:10px;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding-right:23px;
  cursor:pointer;
}

.meta{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:8px;
}

.badge{
  font-size:7px;
  letter-spacing:.3px;
  color:#878a94;
  background:#1a1b20;
  border-radius:4px;
  padding:3px 5px;
}

.star,.info{
  position:absolute;
  border:0;
  background:transparent;
  color:#70737e;
  cursor:pointer;
  padding:2px;
  line-height:1;
}

.star{
  right:7px;
  top:7px;
}

.info{
  right:7px;
  bottom:7px;
}

.star svg,.info svg{
  width:12px;
  height:12px;
  display:block;
}

.star.favorite{
  color:#f2d36b;
}

.empty{
  padding:45px 10px;
  text-align:center;
  color:#686b75;
  font-size:11px;
  grid-column:1/-1;
}

footer{
  text-align:center;
  color:#555861;
  font-size:9px;
  padding:28px 0 0;
}

@media(max-width:700px){
  .page{
    padding:0 6px;
  }

  .top{
    padding:16px 13px 10px;
  }

  .grid{
    grid-template-columns:repeat(auto-fill,minmax(125px,1fr));
    gap:6px;
  }

  .cover{
    height:72px;
  }

  .card-body{
    height:51px;
  }
}
</style>
</head>

function displayName(file){

  if(specialNames[file]){
    return specialNames[file];
  }

  let n = file
    .replace(/\.(html|htm)$/i,"")
    .replace(/[_-]+/g," ")
    .replace(/([a-z])([A-Z])/g,"$1 $2")
    .replace(/\s+/g," ")
    .trim();

  if(!n){
    n = file;
  }

  return n
    .split(" ")
    .map(part => {

      if(/^\d/.test(part) || part.length <= 2){
        return part;
      }

      return part.charAt(0).toUpperCase() + part.slice(1);

    })
    .join(" ");
}

function hashColor(text){

  let h = 0;

  for(let i=0;i<text.length;i++){
    h = (h * 31 + text.charCodeAt(i)) >>> 0;
  }

  const hue1 = h % 360;
  const hue2 =
    (hue1 + 35 + ((h >>> 8) % 60)) % 360;

  return [
    `hsl(${hue1} 72% 28%)`,
    `hsl(${hue2} 75% 23%)`
  ];
}

function initials(name){

  const words = name
    .split(/\s+/)
    .filter(Boolean);

  if(words.length >= 2){
    return (
      words[0][0] +
      words[1][0]
    ).toUpperCase();
  }

  return (
    name
      .replace(/[^a-z0-9]/gi,"")
      .slice(0,2)
      .toUpperCase() || "??"
  );
}

function matchesCategory(file,category){

  if(category === "All" || category === "Offline"){
    return true;
  }

  if(category === "Favorites"){
    return state.favorites.has(file);
  }

  return categoryMatchers[category]
    ? categoryMatchers[category].test(
        file + " " + displayName(file)
      )
    : false;
}

function filteredGames(){

  const q = state.query.toLowerCase();

  return files.filter(file => {

    const name = displayName(file);

    return (
      matchesCategory(file,state.category) &&
      (
        !q ||
        file.toLowerCase().includes(q) ||
        name.toLowerCase().includes(q)
      )
    );

  });
}

function categoryCount(category){

  return files.filter(file =>
    matchesCategory(file,category)
  ).length;
}

function saveFavorites(){

  localStorage.setItem(
    "tog-game-favorites",
    JSON.stringify([...state.favorites])
  );
}



function openGame(file){
  const gameUrl =
    "https://thatoneguy-67.github.io/Games/offline/" +
    encodeURIComponent(file);

  fetch(gameUrl)
    .then(response => response.text())
    .then(text => {
      const newWin = window.open("about:blank", "_blank");
      if (newWin) {
        newWin.document.open();
        newWin.document.write(text);
        newWin.document.close();
     }
    });

  if(!newWin){
    alert("Please allow popups for this site.");
    return;
  }

  win.location.href = gameUrl;
}


function renderFilters(){

  const el =
    document.getElementById("filters");

  el.innerHTML = "";

  categoryNames.forEach(category => {

    const button =
      document.createElement("button");

    button.className =
      "filter" +
      (state.category === category
        ? " active"
        : "");

    const count =
      category === "All"
        ? files.length
        : categoryCount(category);

    button.innerHTML =
      `${category} <span class="count">${count}</span>`;

    button.onclick = () => {

      state.category = category;

      render();

    };

    el.appendChild(button);

  });
}

function render(){

  const list = filteredGames();

  document.getElementById("subtitle").textContent =
    `${files.length.toLocaleString()} offline games, one click away`;

  document.getElementById("results").textContent =
    `// ${state.category.toLowerCase()} — ${list.length.toLocaleString()} results`;

  renderFilters();

  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";

  if(!list.length){

    grid.innerHTML =
      '<div class="empty">No games found.</div>';

    return;
  }

  const frag =
    document.createDocumentFragment();

  list.forEach(file => {

    const name =
      displayName(file);

    const [c1,c2] =
      hashColor(file);

    const card =
      document.createElement("article");

    card.className = "card";

    const favorite =
      state.favorites.has(file);

    card.innerHTML = `

      <div
        class="cover"
        style="--c1:${c1};--c2:${c2}"
      >
        <div class="initials">
          ${escapeHtml(initials(name))}
        </div>
      </div>

      <div class="card-body">

        <div
          class="name"
          title="${escapeHtml(name)}"
        >
          ${escapeHtml(name)}
        </div>

        <button
          class="star ${favorite ? "favorite" : ""}"
          title="Favorite"
        >
          <svg
            viewBox="0 0 24 24"
            fill="${favorite ? "currentColor" : "none"}"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>
          </svg>
        </button>

        <div class="meta">
          <span class="badge">OFFLINE</span>
        </div>

        <button
          class="info"
          title="Open game"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M12 10.5v5M12 7.5h.01"/>
          </svg>
        </button>

      </div>
    `;

    card.querySelector(".cover").onclick =
      () => openGame(file);

    card.querySelector(".name").onclick =
      () => openGame(file);

    card.querySelector(".info").onclick =
      () => openGame(file);

    card.querySelector(".star").onclick =
      event => {

        event.stopPropagation();

        if(state.favorites.has(file)){
          state.favorites.delete(file);
        }else{
          state.favorites.add(file);
        }

        saveFavorites();
        render();

      };

    frag.appendChild(card);

  });

  grid.appendChild(frag);
}

function escapeHtml(value){

  return value.replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    })[char]
  );

}

document
  .getElementById("search")
  .addEventListener("input",event => {

    state.query =
      event.target.value.trim();

    render();

  });

render();
